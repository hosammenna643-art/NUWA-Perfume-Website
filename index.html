<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NÜWA | Luxury Perfumes</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>

/* COLORS */
:root{
--gold:#C9A96E;
--darkgold:#A68B4B;
--cream:#FDF8F0;
--dark:#1A1410;
--brown:#2C2218;
--warm:#F5EDE0;
--rose:#D4A0A0;
--sand:#E8D5B7;
}

/* RESET */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins', sans-serif;
}

body{
background:var(--cream);
color:var(--dark);
scroll-behavior:smooth;
}

/* NAVBAR */
nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 60px;
position:fixed;
width:100%;
top:0;
background:rgba(255,255,255,0.9);
backdrop-filter:blur(10px);
z-index:1000;
border-bottom:1px solid var(--sand);
}

.logo{
font-family:'Playfair Display', serif;
font-size:28px;
letter-spacing:3px;
color:var(--gold);
}

.nav-links a{
color:var(--dark);
text-decoration:none;
margin:0 15px;
font-size:14px;
transition:0.3s;
}

.nav-links a:hover{
color:var(--gold);
}

/* HERO (مناسب 1920x1080) */
.hero{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;

/* الصورة + overlay */
background:
linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
url("images/hero.jpg");

/* أهم إعدادات */
background-size:cover;
background-position:center;
background-repeat:no-repeat;

/* يحافظ على النعومة */
image-rendering:auto;
}

.hero h1{
font-family:'Playfair Display', serif;
font-size:60px;
letter-spacing:3px;
color:#fff;
}

.hero p{
margin-top:15px;
color:#eee;
}

/* BUTTON */
.btn{
display:inline-block;
margin-top:25px;
padding:12px 30px;
background:var(--gold);
color:#000;
text-decoration:none;
border-radius:30px;
transition:0.3s;
}

.btn:hover{
background:#fff;
}

/* PRODUCTS */
.products{
padding:100px 60px;
background:var(--cream);
}

.products h2{
text-align:center;
font-family:'Playfair Display', serif;
margin-bottom:50px;
color:var(--dark);
}

.product-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:30px;
}

.card{
background:#fff;
padding:20px;
border-radius:15px;
text-align:center;
transition:0.3s;
border:1px solid var(--sand);
position:relative;
}

.card:hover{
transform:translateY(-10px);
border-color:var(--gold);
box-shadow:0 10px 30px rgba(201,169,110,0.2);
}

/* BADGE */
.badge{
position:absolute;
top:15px;
left:15px;
background:var(--gold);
color:#fff;
padding:6px 12px;
font-size:12px;
border-radius:20px;
font-weight:bold;
animation:pulse 2s infinite;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.05);}
100%{transform:scale(1);}
}

/* IMAGE */
.card img{
width:100%;
height:250px;
object-fit:contain;
background:var(--warm);
padding:10px;
border-radius:10px;
}

.card h3{
margin:15px 0;
color:var(--dark);
}

.card p{
color:var(--brown);
}

/* TAG */
.tag{
display:inline-block;
margin-bottom:10px;
padding:5px 12px;
border-radius:20px;
font-size:12px;
font-weight:bold;
}

.tag.man{background:#e8d5b7;}
.tag.woman{background:#f5d0d0;}
.tag.unisex{background:#d4af37;color:#fff;}

/* BUTTON */
.card button{
padding:10px 20px;
border:none;
background:var(--gold);
color:var(--dark);
cursor:pointer;
border-radius:20px;
transition:0.3s;
}

.card button:hover{
background:var(--darkgold);
color:#fff;
}

/* FOOTER */
footer{
text-align:center;
padding:30px;
background:#fff;
color:var(--brown);
border-top:1px solid var(--sand);
}

</style>

</head>

<body>

<!-- NAVBAR -->

<nav>
<div class="logo">NÜWA</div>
<div class="nav-links">
<a href="index.html">Home</a>
<a href="products.html">Products</a>
<a href="offers.html">Offers</a>
<a href="cart.html">Cart</a>
<a href="contact.html">Contact</a>
</div>
</nav>


<section class="hero">
<div>
<h1>Unveil Your Essence</h1>
<p>Luxury fragrances crafted for timeless elegance</p>
<a href="products.html" class="btn">Shop Now</a>
</div>
</section>

<!-- PRODUCTS -->

<section class="products">
<h2>Featured Collection</h2>

<div class="product-grid">

<div class="card">
<div class="badge">Best Seller</div>
<img src="images/oud.jpg">
<h3>Royal Oud</h3>
<div class="tag man">For Man</div>
<p>$120</p>
<button onclick="addToCart('Royal Oud')">Add to Cart</button>
</div>

<div class="card">
<div class="badge">Best Seller</div>
<img src="images/rose.jpg">
<h3>Velvet Rose</h3>
<div class="tag woman">For Woman</div>
<p>$95</p>
<button onclick="addToCart('Velvet Rose')">Add to Cart</button>
</div>

<div class="card">
<img src="images/amber.jpg">
<h3>Golden Amber</h3>
<div class="tag unisex">Unisex</div>
<p>$110</p>
<button onclick="addToCart('Golden Amber')">Add to Cart</button>
</div>

</div>
</section>

<!-- FOOTER -->

<footer>
<p> NÜWA Perfumes </p>
</footer>

<script>
function addToCart(product){
let cart = JSON.parse(localStorage.getItem("cart")) || [];

cart.push({
name: product,
price: product === "Royal Oud" ? 120 :
       product === "Velvet Rose" ? 95 : 110
});

localStorage.setItem("cart", JSON.stringify(cart));
alert(product + " added to cart 🛒");
}
</script>

</body>
</html>
