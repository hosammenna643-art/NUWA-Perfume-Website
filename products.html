<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NÜWA | Products</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>

/* COLORS */
:root{
--gold:#C9A96E;
--darkgold:#A68B4B;
--cream:#FDF8F0;
--dark:#1A1410;
--brown:#2C2218;
--sand:#E8D5B7;
--warm:#F5EDE0;
}

/* RESET */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins', sans-serif;
}

body{
background:var(--cream);
color:var(--dark);
animation:fadeIn 0.6s ease;
}

/* ANIMATION */
@keyframes fadeIn{
from{opacity:0; transform:translateY(20px);}
to{opacity:1; transform:translateY(0);}
}

/* NAVBAR */
nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 60px;
position:fixed;
width:100%;
top:0;
background:rgba(255,255,255,0.9);
backdrop-filter:blur(10px);
z-index:1000;
border-bottom:1px solid var(--sand);
}

.logo{
font-family:'Playfair Display', serif;
font-size:28px;
letter-spacing:3px;
color:var(--gold);
}

.nav-links a{
color:var(--dark);
text-decoration:none;
margin:0 15px;
transition:0.3s;
}

.nav-links a:hover{
color:var(--gold);
}

/* SECTION */
.section{
padding:120px 60px 60px;
}

.section h2{
font-family:'Playfair Display', serif;
margin-bottom:40px;
color:var(--dark);
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:30px;
}

/* CARD */
.card{
background:#fff;
border-radius:15px;
padding:20px;
text-align:center;
border:1px solid var(--sand);
transition:0.4s;
overflow:hidden;
position:relative;

/* تحسين يمنع الشكل يبوظ */
min-height:380px;
display:flex;
flex-direction:column;
justify-content:space-between;
}

.card:hover{
transform:translateY(-10px) scale(1.02);
box-shadow:0 15px 40px rgba(0,0,0,0.1);
}

/* IMAGE */
.card img{
width:100%;
height:250px;
object-fit:contain;
background:var(--warm);
padding:10px;
border-radius:10px;
transition:0.4s;
}

.card:hover img{
transform:scale(1.08);
}

/* TITLE */
.card h3{
margin:15px 0;
font-family:'Playfair Display', serif;
}

/* ✅ PRICE */
.price{
color:var(--gold);
font-weight:bold;
margin-bottom:10px;
font-size:18px;
}

/* BUTTON */
.card button{
padding:10px 20px;
border:none;
background:var(--gold);
color:var(--dark);
border-radius:20px;
cursor:pointer;
transition:0.3s;
}

.card button:hover{
background:var(--darkgold);
color:#fff;
}

</style>

</head>

<body>

<!-- NAVBAR -->

<nav>
<div class="logo">NÜWA</div>
<div class="nav-links">
<a href="index.html">Home</a>
<a href="products.html">Products</a>
<a href="offers.html">Offers</a>
<a href="cart.html">Cart</a>
<a href="contact.html">Contact</a>
</div>
</nav>



<section class="section">
<h2>Women Collection</h2>

<div class="grid">

<div class="card">
<img src="images/amber.jpg" onerror="this.src='images/fallback.jpg'">
<h3>AMBER</h3>
<div class="price">$120</div>
<button onclick="addToCart('AMBER',120)">Add to Cart</button>
</div>

<div class="card">
<img src="images/neroli.jpg" onerror="this.src='images/fallback.jpg'">
<h3>NÉROLI</h3>
<div class="price">$110</div>
<button onclick="addToCart('NÉROLI',110)">Add to Cart</button>
</div>

<div class="card">
<img src="images/lumiere.jpg" onerror="this.src='images/fallback.jpg'">
<h3>LUMIÈRE</h3>
<div class="price">$130</div>
<button onclick="addToCart('LUMIÈRE',130)">Add to Cart</button>
</div>

</div>
</section>

<!-- MEN -->

<section class="section">
<h2>Men Collection</h2>

<div class="grid">

<div class="card">
<img src="images/cote.jpg" onerror="this.src='images/fallback.jpg'">
<h3>CÓTE</h3>
<div class="price">$125</div>
<button onclick="addToCart('CÓTE',125)">Add to Cart</button>
</div>

<div class="card">
<img src="images/noir.jpg" onerror="this.src='images/fallback.jpg'">
<h3>NOIR</h3>
<div class="price">$140</div>
<button onclick="addToCart('NOIR',140)">Add to Cart</button>
</div>

<div class="card">
<img src="images/tobacco.jpg" onerror="this.src='images/fallback.jpg'">
<h3>TOBACCO</h3>
<div class="price">$150</div>
<button onclick="addToCart('TOBACCO',150)">Add to Cart</button>
</div>

</div>
</section>

<script>

/* ADD TO CART */
function addToCart(name, price){
let cart = JSON.parse(localStorage.getItem("cart")) || [];

cart.push({
name:name,
price:price,
quantity:1
});

localStorage.setItem("cart", JSON.stringify(cart));

alert(name + " added to cart 🛒");
}

</script>

</body>
</html>
