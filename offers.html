<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NÜWA | Offers</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>

/* COLORS */
:root{
--gold:#C9A96E;
--darkgold:#A68B4B;
--cream:#FDF8F0;
--dark:#1A1410;
--brown:#2C2218;
--sand:#E8D5B7;
}

/* RESET */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins', sans-serif;
}

body{
background:var(--cream);
color:var(--dark);
overflow-x:hidden;
}

/* NAVBAR */
nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 60px;
position:fixed;
width:100%;
top:0;
background:rgba(255,255,255,0.9);
backdrop-filter:blur(10px);
z-index:1000;
border-bottom:1px solid var(--sand);
}

.logo{
font-family:'Playfair Display', serif;
font-size:28px;
color:var(--gold);
}

.nav-links a{
color:var(--dark);
margin:0 15px;
text-decoration:none;
}

/* SECTION */
.section{
padding:120px 60px;
text-align:center;
}

.section h1{
font-family:'Playfair Display', serif;
margin-bottom:40px;
}

/* OFFERS GRID */
.offers{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:30px;
}

/* CARD */
.offer-card{
background:#fff;
border-radius:20px;
overflow:hidden;
border:1px solid var(--sand);
transition:0.4s;
position:relative;
}

.offer-card:hover{
transform:translateY(-10px) scale(1.02);
box-shadow:0 25px 60px rgba(0,0,0,0.15);
}

/* IMAGE */
.offer-card img{
width:100%;
height:250px;
object-fit:contain;
background:#f5ede0;
padding:10px;
}

/* CONTENT */
.offer-content{
padding:25px;
}

/* TITLE */
.offer-content h2{
font-family:'Playfair Display', serif;
}

/* TEXT */
.offer-content p{
margin:15px 0;
color:var(--brown);
}

/* BADGE */
.badge{
position:absolute;
top:15px;
left:15px;
background:var(--gold);
color:#fff;
padding:5px 12px;
border-radius:20px;
font-size:12px;
}

/* TIMER */
.timer{
margin-top:10px;
font-size:14px;
color:var(--darkgold);
}

/* BUTTON */
.offer-content button{
margin-top:20px;
padding:12px 25px;
border:none;
background:var(--gold);
color:var(--dark);
border-radius:25px;
cursor:pointer;
transition:0.3s;
}

.offer-content button:hover{
background:var(--darkgold);
color:#fff;
}

/* GLOW EFFECT */
.offer-card:hover{
box-shadow:0 0 20px rgba(201,169,110,0.5);
}

</style>

</head>

<body>

<!-- NAVBAR -->

<nav>
<div class="logo">NÜWA</div>
<div class="nav-links">
<a href="index.html">Home</a>
<a href="products.html">Products</a>
<a href="offers.html">Offers</a>
<a href="cart.html">Cart</a>
<a href="contact.html">Contact</a>
</div>
</nav>

<section class="section">

<h1>Exclusive Offers</h1>

<div class="offers">

<!-- WOMEN -->

<div class="offer-card">
<div class="badge">🔥 Limited Time</div>
<img src="images/amber.jpg">

<div class="offer-content">
<h2>Buy 2, Get 1 Free</h2>
<p>Purchase any two fragrances and receive a third one as a complimentary gift.</p>
<div class="timer" id="timer1"></div>
<button onclick="addOffer('AMBER',120)">Get Offer</button>
</div>
</div>

<!-- MEN -->

<div class="offer-card">
<div class="badge">🔥 Limited Time</div>
<img src="images/tobacco.jpg">

<div class="offer-content">
<h2>25% Off Premium Selection</h2>
<p>Enjoy an exclusive 25% discount on our finest men's fragrances.</p>
<div class="timer" id="timer2"></div>
<button onclick="addOffer('TOBACCO',150, true)">Get Offer</button>
</div>
</div>

</div>

</section>

<script>

/* ADD OFFER TO CART */
function addOffer(name, price, discount=false){
let cart = JSON.parse(localStorage.getItem("cart")) || [];

if(discount){
price = price * 0.75;
}

cart.push({
name:name,
price:price,
quantity:1
});

localStorage.setItem("cart", JSON.stringify(cart));
alert(name + " offer added 🛒");
}

/* TIMER */
function startTimer(id){
let end = new Date().getTime() + (24 * 60 * 60 * 1000);

setInterval(()=>{
let now = new Date().getTime();
let diff = end - now;

let h = Math.floor(diff / (1000*60*60));
let m = Math.floor((diff % (1000*60*60)) / (1000*60));
let s = Math.floor((diff % (1000*60)) / 1000);

document.getElementById(id).innerHTML = "Ends in: " + h + "h " + m + "m " + s + "s";
},1000);
}

startTimer("timer1");
startTimer("timer2");

</script>

</body>
</html>
